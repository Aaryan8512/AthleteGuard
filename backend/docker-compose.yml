services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athleteguard
      POSTGRES_USER: athleteguard
      POSTGRES_PASSWORD: athleteguard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U athleteguard -d athleteguard']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://athleteguard:athleteguard@db:5432/athleteguard
      JWT_SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
